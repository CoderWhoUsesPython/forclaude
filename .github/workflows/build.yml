name: Build IPA

on:
  workflow_dispatch:
    inputs:
      archs:
        description: "Architectures for the app and the dext"
        default: "arm64 arm64e"
  push:
    branches: ["**"]

# Optional repository secrets (Settings > Secrets and variables > Actions). With none set, this
# produces an ad-hoc signed IPA for SideStore to re-sign, exactly as before.
#   TEAM_ID             your Apple team id; replaces the TEAMID placeholder in the dext bundle id
#   SIGN_CERT_P12       base64 of your development certificate (.p12)
#   SIGN_CERT_PASSWORD  the .p12 password
#   DEXT_PROFILE        base64 of a .mobileprovision to embed in the dext (optional)
jobs:
  build:
    # If this label is rejected, try macos-latest or the newest macos-NN label GitHub lists.
    runs-on: macos-latest
    env:
      HAVE_TEAM: ${{ secrets.TEAM_ID != '' }}
      HAVE_CERT: ${{ secrets.SIGN_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          echo "iphoneos SDK:  $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "driverkit SDK: $(xcrun --sdk driverkit --show-sdk-path)"
          xcrun --sdk driverkit --find iig || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply team id (optional)
        if: env.HAVE_TEAM == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: sed -i '' "s/TEAMID/${TEAM_ID}/g" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        env:
          ARCHS_IN: ${{ inputs.archs || 'arm64 arm64e' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project UsbmuxProbe.xcodeproj \
            -scheme UsbmuxProbeApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS="$ARCHS_IN" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | tail -n 150

      - name: Import signing certificate (optional)
        if: env.HAVE_CERT == 'true'
        env:
          SIGN_CERT_P12: ${{ secrets.SIGN_CERT_P12 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          set -e
          KC="$RUNNER_TEMP/sign.keychain-db"
          KP="$(uuidgen)"
          echo "$SIGN_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$SIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENT="$(security find-identity -v -p codesigning "$KC" | awk 'NR==1 {print $2}')"
          test -n "$IDENT" || { echo "no codesigning identity found in the p12"; exit 1; }
          echo "IDENT=$IDENT" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Check, sign and package IPA
        env:
          DEXT_PROFILE: ${{ secrets.DEXT_PROFILE }}
        run: |
          set -e
          SIGN="${IDENT:--}"
          APP=$(find build/Build/Products -maxdepth 2 -name 'UsbmuxProbe.app' | head -n 1)
          test -n "$APP" || { echo "app bundle not found"; exit 1; }

          echo "--- app slices"
          lipo -archs "$APP/UsbmuxProbe"

          echo "--- embedded dext"
          ls -la "$APP/SystemExtensions" || { echo "dext was not embedded"; exit 1; }
          for d in "$APP"/SystemExtensions/*.dext; do
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$d/Info.plist")
            echo "$d"
            lipo -archs "$d/$exe"
            vtool -show-build "$d/$exe" | head -n 8
          done

          # Sign so each binary carries its entitlements (ad-hoc unless a certificate was
          # imported). Dext first, then the app; no --deep.
          for d in "$APP"/SystemExtensions/*.dext; do
            if [ -n "$DEXT_PROFILE" ]; then
              echo "$DEXT_PROFILE" | base64 --decode > "$d/embedded.mobileprovision"
            fi
            codesign --force --sign "$SIGN" --timestamp=none --entitlements Driver/Driver.entitlements "$d"
          done
          codesign --force --sign "$SIGN" --timestamp=none --entitlements App/App.entitlements "$APP"

          echo "--- signature (dext)"
          for d in "$APP"/SystemExtensions/*.dext; do
            codesign -dvv "$d" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Signature)" || true
            codesign -d --entitlements :- "$d" 2>/dev/null | grep -o "com.apple.developer[A-Za-z0-9.-]*" | sort -u
            ls "$d" | grep -c embedded.mobileprovision | sed 's/^/embedded profile present: /' || true
          done

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry UsbmuxProbe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UsbmuxProbe-ipa
          path: UsbmuxProbe.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
